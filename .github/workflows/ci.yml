name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOTION_USE_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; else brew install ffmpeg; fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: node scripts/licenses.mjs > /dev/null
      - run: node bin/motion-use.mjs doctor --install-browser
      - name: offline frame review interaction
        run: MOTION_USE_REQUIRE_REVIEW_BROWSER=1 node --test --test-name-pattern="offline frame page" test/directing-review.test.mjs
      # A real render on every platform: fonts, ffmpeg and Chrome differ between them.
      - name: render smoke test
        run: |
          # This template fixture is deliberately music-only; narration is covered below.
          node -e 'const fs=require("fs"),p="examples/mail-use/brief.json",d=JSON.parse(fs.readFileSync(p));d.voiceover.required=false;fs.writeFileSync(p,JSON.stringify(d));'
          node bin/motion-use.mjs validate examples/mail-use/brief.json
          node bin/motion-use.mjs still examples/chrome-use/brief.json --lang zh --format vertical
          node bin/motion-use.mjs render examples/mail-use/brief.json --lang zh --format vertical --quality draft --json > render.json
          cat render.json
          f=$(node -p 'require("./render.json").outputs[0].file')
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -of compact "$f"
      - name: exact-time film smoke test
        run: |
          # The helper-only examples must stay valid (narration is generated at render, not committed).
          for e in data-story whiteboard kinetic; do node bin/motion-use.mjs validate examples/$e; done
          node bin/motion-use.mjs init "$RUNNER_TEMP/film" --lang en --format square
          node bin/motion-use.mjs validate "$RUNNER_TEMP/film"
          # Shorten only the smoke fixture, preserving a contiguous shot plan.
          # A local tone stands in for a voice fixture; no cloud TTS in CI.
          ffmpeg -v error -y -f lavfi -i 'sine=frequency=880:duration=1' "$RUNNER_TEMP/film/voice.wav"
          node --input-type=module -e 'import fs from "node:fs"; const p=process.env.RUNNER_TEMP+"/film/film.json"; const d=JSON.parse(fs.readFileSync(p)); d.duration=2; d.music={builtin:"pulse",why:"CI smoke fixture: a 2 s shot proves the mix path, not the music"}; d.shots=[{id:"smoke",start:0,end:2,purpose:"Exercise exact-time capture",action:"Two objects move"}]; d.audio=[{file:"voice.wav",lang:"en",role:"voiceover",start:0.1,volume:1}]; fs.writeFileSync(p,JSON.stringify(d));'
          node bin/motion-use.mjs render "$RUNNER_TEMP/film" --allow-code --quality draft --json > film-render.json
          node -e 'const r=require("./film-render.json"); if (!r.ok || !r.outputs[0].verification.ok || !r.outputs[0].verification.narration.ok || !r.snapshot || r.outputs[0].verification.text_check?.skipped) process.exit(1);'
          # Release masters and their manifest; every listed file must match its hash.
          node bin/motion-use.mjs render "$RUNNER_TEMP/film" --allow-code --release --force --json > film-release.json
          node -e 'const r=require("./film-release.json"); if (!r.ok || !r.release_manifest) process.exit(1);'
          node bin/motion-use.mjs verify --manifest "$RUNNER_TEMP/film/out/release/release-manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            examples/*/out/*.mp4
            examples/*/out/preview/*.mp4
            examples/*/out/stills/**/*.png
          if-no-files-found: ignore
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package-release.mjs
      - name: clean install from the packaged archive
        run: |
          export MOTION_USE_HOME="$RUNNER_TEMP/mu-home" MOTION_USE_BIN_DIR="$RUNNER_TEMP/mu-bin" MOTION_USE_SKILL=0
          MOTION_USE_ARCHIVE="$(ls dist/motion-use-v*.tar.gz)" sh install.sh
          "$RUNNER_TEMP/mu-bin/motion-use" --version
          "$RUNNER_TEMP/mu-bin/motion-use" validate examples/ocs/brief.json
